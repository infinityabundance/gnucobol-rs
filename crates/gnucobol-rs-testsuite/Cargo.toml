[package]
name = "gnucobol-rs-testsuite"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
authors = ["infinityabundance"]
description = "GNURUST.GNUCOBOL-TESTSUITE.{1,2,3} — GnuCOBOL 3.2 native Autotest-suite differential court harness (inventory, invocation census, baseline/candidate classification, determinism, receipts, gates)"
