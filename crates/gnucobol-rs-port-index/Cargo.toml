[package]
name = "gnucobol-rs-port-index"
version = "0.1.0"
edition = "2021"
publish = false
description = "Port-governance index for the gnucobol-rs libcob port: typed C-vs-Rust symbol parity (replaces grep name-matching), #if 0 / preprocessor classification, and the generated LIBCOB-PARITY map. Proves the porting process itself; not published."
license = "LGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
