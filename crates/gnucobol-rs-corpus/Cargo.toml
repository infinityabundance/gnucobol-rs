[package]
name = "gnucobol-rs-corpus"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Valid-COBOL corpus subsystem for gnucobol-rs: content-addressed admission, profile-relative validity classification, phase-attributed candidate measurement, and reproducible reports."
license = "LGPL-3.0-or-later"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "gnucobol-rs-corpus"
path = "src/main.rs"

[dependencies]
gnucobol-rs = { path = "../gnucobol-rs", version = "0.8.57" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
