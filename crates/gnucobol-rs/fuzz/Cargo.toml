# Detached fuzz crate: an empty [workspace] makes this its own root, so the parent gate
# (build/test/clippy/fmt) never compiles it.
[package]
name = "gnucobol-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.gnucobol-rs]
path = ".."
features = ["fuzzing"]

[[bin]]
name = "cob_move"
path = "fuzz_targets/cob_move.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pic"
path = "fuzz_targets/pic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "copybook"
path = "fuzz_targets/copybook.rs"
test = false
doc = false
bench = false

[[bin]]
name = "arith"
path = "fuzz_targets/arith.rs"
test = false
doc = false
bench = false
