[package]
name = "kobold-attest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ENTERPRISE.2 — Rust-native DSSE/in-toto attestation signer + verifier (ed25519). Optional, reproducible, no Python crypto dependency. UNSIGNED is an explicit honest state, never a fake green."
publish = false

# Detached from the gnucobol-rs (pure, #![forbid(unsafe_code)]) workspace: crypto/tooling stays out of the
# LGPL court crate. Pinned ed25519 keeps verification reproducible (vs a host python-cryptography build).
[workspace]

[dependencies]
ed25519-compact = "2.3"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
